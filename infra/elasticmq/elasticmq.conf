# Mirrors infra/terraform/sqs.tf; keep the two in step by hand.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  program-generation {
    defaultVisibilityTimeout = 120 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "program-generation-dlq"
      maxReceiveCount = 3
    }
  }
  program-generation-dlq {}
}
